<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Catalogue</title>
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <h1>Dashboard Catalogue de Produits</h1>
        <button id="theme-toggle" class="theme-toggle-btn">
            <i class="fas fa-moon"></i>
        </button>
    </header>

    <main>
        <section id="stats">
            <div class="stat-card">
                <i class="fas fa-tags"></i>
                <h3>Total Catégories</h3>
                <p id="total-categories">0</p>
            </div>
            <div class="stat-card">
                <i class="fas fa-box"></i>
                <h3>Total Produits</h3>
                <p id="total-products">0</p>
            </div>
            <div class="stat-card">
                <i class="fas fa-euro-sign"></i>
                <h3>Valeur Totale Stock</h3>
                <p id="total-value">0 €</p>
            </div>
        </section>

        <section id="categories">
            <h2>Catégories</h2>
            <div class="section-controls">
                <div class="search-container">
                    <input type="text" id="category-search" placeholder="Rechercher une catégorie...">
                    <i class="fas fa-search"></i>
                </div>
                <button id="add-category-btn">Ajouter Catégorie</button>
            </div>
            <table id="categories-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nom</th>
                        <th>Description</th>
                        <th>Nombre de Produits</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="categories-body">
                    <!-- Les données seront insérées ici -->
                </tbody>
            </table>
        </section>

        <section id="products">
            <h2>Produits</h2>
            <div class="section-controls">
                <div class="search-container">
                    <input type="text" id="product-search" placeholder="Rechercher un produit...">
                    <i class="fas fa-search"></i>
                </div>
                <div class="filter-container">
                    <select id="category-filter">
                        <option value="">Toutes les catégories</option>
                    </select>
                </div>
                <button id="add-product-btn">Ajouter Produit</button>
            </div>
            <table id="products-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nom</th>
                        <th>Prix</th>
                        <th>Stock</th>
                        <th>Catégorie</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="products-body">
                    <!-- Les données seront insérées ici -->
                </tbody>
            </table>
        </section>

        <section id="visualizations">
            <h2>Visualisations</h2>
            <button id="refresh-charts-btn" class="refresh-btn">Actualiser les Graphiques</button>
            <div class="chart-container">
                <canvas id="categories-chart"></canvas>
            </div>
            <div class="chart-container">
                <canvas id="products-chart"></canvas>
            </div>
        </section>
    </main>

    <!-- Modals -->
    <div id="category-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3 id="category-modal-title">Ajouter Catégorie</h3>
            <form id="category-form">
                <input type="hidden" id="category-id">
                <label for="category-name">Nom:</label>
                <input type="text" id="category-name" required>
                <label for="category-description">Description:</label>
                <textarea id="category-description" required></textarea>
                <button type="submit">Sauvegarder</button>
            </form>
        </div>
    </div>

    <div id="product-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3 id="product-modal-title">Ajouter Produit</h3>
            <form id="product-form">
                <input type="hidden" id="product-id">
                <label for="product-name">Nom:</label>
                <input type="text" id="product-name" required>
                <label for="product-price">Prix:</label>
                <input type="number" id="product-price" step="0.01" required>
                <label for="product-stock">Stock:</label>
                <input type="number" id="product-stock" required>
                <label for="product-category">Catégorie:</label>
                <select id="product-category" required>
                    <!-- Options will be populated by JS -->
                </select>
                <button type="submit">Sauvegarder</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
